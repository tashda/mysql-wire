name: "Developer Workflow: Build & Test"

on:
  push:
    branches: ["dev", "main"]
  pull_request:
    branches: ["main", "dev"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "Step 1: Compilation Check (Swift 6)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Swift
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: '6.2.4'

      - name: Build library
        run: swift build

      - name: Build tests
        run: swift build --build-tests

  unit-tests:
    name: "Step 2: Unit Tests (MySQLWire)"
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Swift
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: '6.2.4'

      - name: Run Unit Tests
        run: swift test --filter MySQLWireTests
